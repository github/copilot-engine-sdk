name: Publish canary to internal feed

# Publishes @github/copilot-engine-sdk canary builds to the internal Azure
# Artifacts `copilot-canary` feed ONLY — never to public npm. This package is a
# live public npm package (real releases go out via publish.yml), and this repo
# is public, so the guards below (feed-only publish target, fork guard,
# prerelease version scheme) are the whole point: a canary must never shadow or
# reach the public `latest`.

env:
  HUSKY: 0
  # Internal org-scoped Azure Artifacts feed — single source of truth so the
  # feed name isn't repeated across steps. Every publish guard derives from this.
  FEED_URL: "https://pkgs.dev.azure.com/devdiv/_packaging/copilot-canary/npm/registry/"
  # Azure DevOps resource id used to mint an AAD access token for the feed via OIDC.
  ADO_RESOURCE: "499b84ac-1321-427f-aa17-267ca6975798"

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize runs per ref so two overlapping canary runs can't race the feed
# publish. cancel-in-progress: false — never kill an in-flight publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish canary
    # Never run on forks: the canary feed and OIDC federation are internal.
    if: ${{ !github.event.repository.fork }}
    runs-on: ubuntu-latest
    # The admin configures a federated credential on the id-cpd-ci identity with
    # subject repo:github/copilot-engine-sdk:environment:cicd, so this name must
    # stay exactly `cicd`.
    environment: cicd
    permissions:
      contents: read
      id-token: write # Required for OIDC (azure/login)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Default public registry: install and build the package's own deps
      # (@modelcontextprotocol/sdk, zod, esbuild, typescript) which live on
      # public npm, not the feed. --ignore-scripts skips the `prepare` build so
      # we build exactly once below; do NOT write any feed .npmrc yet or npm ci
      # would try to resolve these deps from the upstream-less feed and 404.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      - name: Compute canary version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          SHORT_SHA="${SHA:0:7}"
          # The package.json version must NOT be published verbatim: real
          # releases of that same version go to public npm via publish.yml.
          # Base the canary on the NEXT patch of the current PUBLIC latest so
          # canaries correlate with public releases — they sort ABOVE the public
          # latest and BELOW the eventual real release of that next patch (a
          # prerelease of X.Y.Z always sorts below X.Y.Z), so a canary can never
          # shadow the real release when it ships. Read the public latest from
          # public npm explicitly (never the feed); fail hard if it can't be
          # resolved rather than publish a canary with an unknown base.
          PUBLIC_LATEST="$(npm view @github/copilot-engine-sdk version --registry https://registry.npmjs.org 2>/dev/null || true)"
          BASE="${PUBLIC_LATEST%%-*}"; BASE="${BASE%%+*}"
          if [[ "$BASE" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            NEXT="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$(( BASH_REMATCH[3] + 1 ))"
          else
            echo "::error::Could not resolve public latest version of @github/copilot-engine-sdk (got '$PUBLIC_LATEST'); refusing to publish a canary with an unknown base."
            exit 1
          fi
          VERSION="${NEXT}-canary.${RUN_NUMBER}.g${SHORT_SHA}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Computed canary version '$VERSION' is not valid semver."
            exit 1
          fi
          echo "Canary version: $VERSION (public latest: ${PUBLIC_LATEST:-none})"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set package version
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Azure Login (OIDC -> id-cpd-ci)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: "${{ vars.CPD_ID_CLIENT_ID }}" # id-cpd-ci
          tenant-id: "${{ vars.CPD_ID_TENANT_ID }}"
          allow-no-subscriptions: true

      # Auth-only .npmrc: just the two _authToken lines, NO scoped
      # @github:registry line. The publish target is supplied explicitly via
      # publishConfig + --registry below. A scoped registry line here would make
      # any later install resolve this package's own @github/* deps from the
      # upstream-less feed.
      - name: Configure feed auth (.npmrc)
        run: |
          set -euo pipefail
          TOKEN="$(az account get-access-token --resource "$ADO_RESOURCE" --query accessToken -o tsv)"
          echo "::add-mask::$TOKEN"
          # Derive the protocol-relative auth scopes from FEED_URL (single source
          # of truth): the .../npm/registry/ scope and the .../npm/ base scope.
          FEED_AUTH_REGISTRY="${FEED_URL#https:}"
          FEED_AUTH_BASE="${FEED_AUTH_REGISTRY%registry/}"
          printf '%s\n' \
            "${FEED_AUTH_REGISTRY}:_authToken=${TOKEN}" \
            "${FEED_AUTH_BASE}:_authToken=${TOKEN}" > .npmrc
          echo "Wrote auth-only .npmrc for the canary feed"

      # Guard 1 of 3: pin the publish target in the package itself.
      - name: Set publishConfig registry
        run: npm pkg set "publishConfig.registry=$FEED_URL"

      # Guard 2 of 3: fail loudly unless the effective publish target is exactly
      # the internal feed and is not public/empty. This is the guard that keeps
      # a canary off public npm.
      - name: Assert publish target is the internal feed
        run: |
          set -euo pipefail
          EFFECTIVE="$(npm pkg get publishConfig.registry | tr -d '"')"
          echo "Effective publishConfig.registry: $EFFECTIVE"
          if [ -z "$EFFECTIVE" ] || [ "$EFFECTIVE" = "null" ]; then
            echo "::error::publishConfig.registry is empty. Refusing to publish."
            exit 1
          fi
          if [ "$EFFECTIVE" != "$FEED_URL" ]; then
            echo "::error::publishConfig.registry ('$EFFECTIVE') is not the internal feed ('$FEED_URL'). Refusing to publish."
            exit 1
          fi
          if printf '%s' "$EFFECTIVE" | grep -qi "registry.npmjs.org"; then
            echo "::error::publishConfig.registry points at public npm. Refusing to publish."
            exit 1
          fi

      # Guard 3 of 3: pass the feed explicitly on the publish command, and use
      # the `canary` dist-tag (never `latest`). npm 11 requires an explicit
      # dist-tag for prerelease versions anyway. An idempotent wrapper treats an
      # "already published" conflict as success so re-running a failed run is safe.
      - name: Publish canary to internal feed
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          tmpfile="$(mktemp)"
          trap 'rm -f "$tmpfile"' EXIT
          set +e
          npm publish --registry "$FEED_URL" --tag canary 2>&1 | tee "$tmpfile"
          pipestatus=("${PIPESTATUS[@]}")
          set -e
          status=${pipestatus[0]}
          tee_status=${pipestatus[1]}
          if [ "$tee_status" -ne 0 ]; then
            echo "::error::Failed to capture npm publish output (tee exited ${tee_status})"
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            # Treat an immutable-version conflict as success so re-runs of the
            # same run number are idempotent; propagate any other failure.
            if grep -qiE "cannot publish over the previously published versions|previously published version|EPUBLISHCONFLICT" "$tmpfile"; then
              echo "Version already published; treating as success (idempotent retry)."
            else
              exit "$status"
            fi
          fi
          echo "Published @github/copilot-engine-sdk@${VERSION} (dist-tag: canary)"

      - name: Summarize published canary
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          set -euo pipefail
          {
            echo "## Canary published"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| Package | \`@github/copilot-engine-sdk@${VERSION}\` |"
            echo "| Dist-tag | \`canary\` |"
            echo "| Feed | ${FEED_URL} |"
          } >> "$GITHUB_STEP_SUMMARY"
